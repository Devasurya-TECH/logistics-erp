<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LogiTrace Driver Offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
            color: #0f172a;
        }

        .panel {
            width: min(92vw, 420px);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            padding: 28px 24px;
            text-align: left;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            padding: 8px 12px;
            text-transform: uppercase;
        }

        h1 {
            margin: 16px 0 8px;
            font-size: 28px;
            line-height: 1.15;
        }

        p {
            margin: 0;
            color: #475569;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <section class="panel">
        <div class="badge">Offline</div>
        <h1>LogiTrace Driver is offline</h1>
        <p>Reconnect to continue trips, sync proofs, and receive live updates from the supervisor panel.</p>
    </section>
</body>
</html>
